name: Quality Gate

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in production artifacts.
        required: false
        default: ""
        type: string
      commit:
        description: Commit identifier embedded in frontend artifacts.
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version embedded in production artifacts.
        required: false
        type: string
      commit:
        description: Optional commit identifier embedded in frontend artifacts.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.24.13
  NODE_VERSION: 20.19.5

jobs:
  metadata:
    name: Metadata and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build-metadata.outputs.version }}
      commit: ${{ steps.build-metadata.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve deterministic build metadata
        id: build-metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION//[[:space:]]/}"
          commit="${INPUT_COMMIT//[[:space:]]/}"
          if [[ -z "$version" ]]; then version="ci-${GITHUB_SHA::12}"; fi
          if [[ -z "$commit" ]]; then commit="${GITHUB_SHA::12}"; fi
          if [[ ! "$version" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "invalid build version: $version" >&2
            exit 1
          fi
          if [[ ! "$commit" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "invalid build commit: $commit" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check changed patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]]; then
            git diff --check "$PUSH_BEFORE_SHA..$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

      - name: Set up Node.js for metadata validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate repository toolchain metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s VERSION
          git ls-files --error-unmatch \
            server/go.mod \
            server/go.sum \
            server/web/package.json \
            server/web/pnpm-lock.yaml \
            server/zashboard/package.json \
            server/zashboard/pnpm-lock.yaml >/dev/null
          node <<'NODE'
          const { readFileSync } = require('node:fs')
          for (const path of ['server/web/package.json', 'server/zashboard/package.json']) {
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            if (!/^pnpm@\d+\.\d+\.\d+$/.test(manifest.packageManager ?? '')) {
              throw new Error(`${path} must pin packageManager to an exact pnpm version`)
            }
          }
          NODE

      - name: Set up Go for workflow validation
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Validate GitHub Actions workflows
        run: make verify-workflows

  go:
    name: Go quality
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Verify modules
        working-directory: server
        run: go mod download && go mod verify

      - name: Check formatting and vet
        run: make format-check-go lint-go

      - name: Test with randomized order
        run: make test-go-shuffle

      - name: Race test
        run: make test-go-race

      - name: Coverage
        run: make coverage-go

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-go-coverage
          path: |
            server/coverage.out
            server/coverage.txt
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: WebUI quality
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: server/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server/web
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and types
        working-directory: server/web
        run: pnpm format:check && pnpm lint && pnpm typecheck

      - name: Test
        working-directory: server/web
        run: pnpm test && pnpm test:build-scripts

      - name: Build deterministic embedded export
        working-directory: server/web
        env:
          NEXT_BUILD_ID: ${{ needs.metadata.outputs.commit }}
          NEXT_PUBLIC_APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: pnpm build:embedded

      - name: Upload WebUI build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-web-build
          path: server/web/build
          if-no-files-found: error
          retention-days: 1

  zashboard:
    name: Zashboard quality
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: server/zashboard/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: server/zashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server/zashboard
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and types
        working-directory: server/zashboard
        run: pnpm format:check && pnpm lint && pnpm type-check

      - name: Test security regressions
        working-directory: server/zashboard
        run: pnpm test:notification-safety

      - name: Build deterministic embedded export
        working-directory: server/zashboard
        env:
          ZASHBOARD_COMMIT_ID: ${{ needs.metadata.outputs.commit }}
        run: pnpm build:embedded

      - name: Upload Zashboard build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-zashboard-build
          path: server/zashboard/dist
          if-no-files-found: error
          retention-days: 1

  swagger:
    name: Swagger freshness
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Verify generated Swagger
        run: make verify-swagger

  baseline-tools:
    name: Phase 0 baseline tools
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run disposable baseline self-test
        run: make test-baseline

  production-build:
    name: Embedded production build
    needs: [metadata, go, web, zashboard, swagger, baseline-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download WebUI build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-web-build
          path: server/web/build

      - name: Download Zashboard build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-zashboard-build
          path: server/zashboard/dist

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Build canonical embedded binary
        run: |
          make build-server-from-assets \
            VERSION="${{ needs.metadata.outputs.version }}" \
            COMMIT="${{ needs.metadata.outputs.commit }}" \
            SERVER_BINARY="$PWD/dist/poolnext-server"
          test "$(dist/poolnext-server --version)" = "${{ needs.metadata.outputs.version }}"

      - name: Upload production binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-poolnext-server-linux-amd64
          path: dist/poolnext-server
          if-no-files-found: error
          retention-days: 1

  windows-smoke:
    name: Windows build and startup smoke
    needs: [metadata, web, zashboard]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download WebUI build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-web-build
          path: server/web/build

      - name: Download Zashboard build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-zashboard-build
          path: server/zashboard/dist

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Compile Go test binaries for Windows
        working-directory: server
        shell: bash
        run: go test -run '^$' ./...

      - name: Run portable kernel asset tests on Windows
        working-directory: server
        shell: bash
        run: |
          go test -count=1 \
            -run '^Test(IsSupportedMihomoBinaryAsset|SelectMihomoReleaseAsset|PrepareMihomoReleaseBinary)' \
            ./internal/service

      - name: Build embedded Windows binary
        working-directory: server
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          go build -tags embedassets -trimpath -buildvcs=false \
            -ldflags "-s -w -X poolx/internal/pkg/common.Version=${BUILD_VERSION}" \
            -o ../dist/poolnext-server-windows-amd64.exe .

      - name: Verify embedded binary version
        working-directory: server
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(../dist/poolnext-server-windows-amd64.exe --version)"
          actual="${actual%$'\r'}"
          echo "reported version: ${actual}"
          test "${actual}" = "${BUILD_VERSION}"

      - name: Start binary and probe embedded WebUI
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\poolnext-server-windows-amd64.exe'
          $dataDir = Join-Path $env:RUNNER_TEMP 'poolnext-windows-smoke'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $stdoutPath = Join-Path $dataDir 'server-stdout.log'
          $stderrPath = Join-Path $dataDir 'server-stderr.log'
          $portProbe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $portProbe.Start()
          $port = $portProbe.LocalEndpoint.Port
          $portProbe.Stop()
          $baseUrl = "http://127.0.0.1:$port"

          $randomPart = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 40 | ForEach-Object { [char]$_ })
          $env:SESSION_SECRET = "WindowsSmoke-$randomPart-0001"
          $env:SQLITE_PATH = Join-Path $dataDir 'poolx.db'
          $env:LOG_LEVEL = 'info'

          $server = Start-Process -FilePath $exe `
            -ArgumentList @('--port', "$port") `
            -WorkingDirectory $dataDir `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -WindowStyle Hidden `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $index = $null
            while ((Get-Date) -lt $deadline) {
              if ($server.HasExited) {
                throw "server exited early with code $($server.ExitCode)"
              }
              try {
                $index = Invoke-WebRequest -Uri "$baseUrl/" -UseBasicParsing -TimeoutSec 3
                if ($index.StatusCode -eq 200) { break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $index -or $index.StatusCode -ne 200) {
              throw 'embedded WebUI did not become available on /'
            }
            if ($index.Content -notmatch 'PoolNeXt') {
              throw 'embedded WebUI response does not look like the PoolNeXt console'
            }

            $status = Invoke-RestMethod -Uri "$baseUrl/api/status" -TimeoutSec 15
            if (-not $status.success) {
              throw 'status API returned success=false'
            }
            if ($status.data.version -ne $env:BUILD_VERSION) {
              throw "status API version '$($status.data.version)' does not match expected '$env:BUILD_VERSION'"
            }

            if (-not (Test-Path $env:SQLITE_PATH)) {
              throw "SQLite database was not created at $env:SQLITE_PATH"
            }
            if ((Get-Item $env:SQLITE_PATH).Length -le 0) {
              throw 'SQLite database file is empty'
            }

            $logText = Get-Content -Path $stdoutPath -Raw -Encoding utf8
            if ($logText -notmatch '一次性密码') {
              throw 'first-run bootstrap credentials were not printed to stdout'
            }
            Write-Host 'Windows startup smoke passed: embedded WebUI, status API, SQLite bootstrap and one-time password all verified.'
          } catch {
            Write-Host '--- server stdout (tail) ---'
            if (Test-Path $stdoutPath) { Get-Content $stdoutPath -Tail 200 }
            Write-Host '--- server stderr (tail) ---'
            if (Test-Path $stderrPath) { Get-Content $stderrPath -Tail 200 }
            throw
          } finally {
            if ($null -ne $server) {
              try {
                if (-not $server.HasExited) {
                  Stop-Process -Id $server.Id -Force
                }
              } catch {
                Write-Host "server cleanup skipped: $_"
              }
            }
          }

      - name: Verify portable launcher and data-dir flags
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portableDir = Join-Path $env:RUNNER_TEMP 'poolnext-portable'
          $workingDir = Join-Path $env:RUNNER_TEMP 'poolnext-portable-cwd'
          New-Item -ItemType Directory -Force -Path $portableDir, $workingDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist\poolnext-server-windows-amd64.exe') -Destination (Join-Path $portableDir 'poolnext-server-windows-amd64.exe') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'scripts\poolnext-portable.cmd') -Destination (Join-Path $portableDir 'poolnext-portable.cmd') -Force

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $env:POOLNEXT_PORT = "$port"

          $stdoutPath = Join-Path $env:RUNNER_TEMP 'portable-stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'portable-stderr.log'
          $launcher = Join-Path $portableDir 'poolnext-portable.cmd'
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/c', "`"$launcher`"") -WorkingDirectory $workingDir -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          try {
            $deadline = (Get-Date).AddSeconds(120)
            $status = $null
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "Portable launcher exited early with code $($process.ExitCode)"
              }
              try {
                $status = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 3
                if ($status.success) { break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $status -or -not $status.success) {
              throw 'Portable launcher did not start the server'
            }
            if ($status.data.version -ne $env:BUILD_VERSION) {
              throw "Portable launcher API version '$($status.data.version)' does not match expected '$env:BUILD_VERSION'."
            }

            $secretPath = Join-Path $portableDir 'poolnext-secret.txt'
            if (-not (Test-Path -LiteralPath $secretPath)) {
              throw 'Portable launcher did not create the SESSION_SECRET file.'
            }
            $secret = (Get-Content -LiteralPath $secretPath -Raw -Encoding ascii).Trim()
            if ($secret -notmatch '^[0-9a-f]{64}$') {
              throw 'Portable launcher created a SESSION_SECRET with an unexpected format.'
            }
            if (-not (Test-Path -LiteralPath (Join-Path $portableDir 'poolx.db'))) {
              throw '--data-dir did not place the SQLite database under the portable folder.'
            }
            if (-not (Test-Path -LiteralPath (Join-Path $portableDir 'upload'))) {
              throw '--data-dir did not place the upload directory under the portable folder.'
            }
            if (-not (Test-Path -LiteralPath (Join-Path $portableDir 'logs'))) {
              throw 'Portable launcher did not create the logs directory.'
            }
            if ((Get-ChildItem -LiteralPath $workingDir -Force | Measure-Object).Count -ne 0) {
              throw 'Portable launcher wrote files into the working directory instead of the portable folder.'
            }
            Write-Host 'Portable launcher check passed: data-dir isolation, secret generation and API startup verified.'
          } catch {
            Write-Host '--- portable launcher stdout (tail) ---'
            if (Test-Path $stdoutPath) { Get-Content $stdoutPath -Tail 100 }
            Write-Host '--- portable launcher stderr (tail) ---'
            if (Test-Path $stderrPath) { Get-Content $stderrPath -Tail 100 }
            throw
          } finally {
            try {
              taskkill /PID $process.Id /T /F 2>&1 | Out-Null
            } catch {
              Write-Host "portable launcher cleanup warning: $_"
            }
            if (Test-Path -LiteralPath $portableDir) { Remove-Item -LiteralPath $portableDir -Recurse -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $workingDir) { Remove-Item -LiteralPath $workingDir -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: Validate Windows service helper syntax
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE 'scripts\poolnext-windows-service.ps1'
          if (-not (Test-Path -LiteralPath $helper)) {
            throw "Windows service helper is missing: $helper"
          }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($helper, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host ("line {0}, column {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            throw "PowerShell parser reported $($errors.Count) error(s) in the Windows service helper."
          }
          Write-Host "Windows service helper syntax is valid ($($tokens.Count) tokens)."

      # Non-blocking until the NSSM harness has proven stable across runner images;
      # promote to a required step once it is consistently green.
      - name: Exercise NSSM service helper end to end
        shell: pwsh
        continue-on-error: true
        env:
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nssmZip = Join-Path $env:RUNNER_TEMP 'nssm-2.24.zip'
          Invoke-WebRequest -Uri 'https://nssm.cc/release/nssm-2.24.zip' -OutFile $nssmZip -UseBasicParsing
          $expectedHash = '727d1e42275c605e0f04aba98095c38a8e1e46def453cdffce42869428aa6743'
          $actualHash = (Get-FileHash -LiteralPath $nssmZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Unexpected NSSM archive hash: $actualHash"
          }
          Expand-Archive -LiteralPath $nssmZip -DestinationPath $env:RUNNER_TEMP -Force
          $nssm = Join-Path $env:RUNNER_TEMP 'nssm-2.24\win64\nssm.exe'
          if (-not (Test-Path -LiteralPath $nssm)) {
            throw "nssm.exe was not extracted from the archive"
          }

          $helper = Join-Path $env:GITHUB_WORKSPACE 'scripts\poolnext-windows-service.ps1'
          $binary = Join-Path $env:GITHUB_WORKSPACE 'dist\poolnext-server-windows-amd64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'poolnext-service-smoke'
          $serviceName = 'PoolNeXtCITest'

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()

          try {
            & $helper install -InstallDir $installDir -ServiceName $serviceName -Port $port -NssmPath $nssm -BinaryPath $binary
            & $helper status -InstallDir $installDir -ServiceName $serviceName -Port $port

            $service = Get-Service -Name $serviceName
            if ($service.Status -ne 'Running') {
              throw "Service state is '$($service.Status)' after install; expected Running."
            }
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 10
            if ($response.data.version -ne $env:BUILD_VERSION) {
              throw "Service API version '$($response.data.version)' does not match expected '$env:BUILD_VERSION'."
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installDir 'poolx.db'))) {
              throw "Service did not create its SQLite database under $installDir."
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installDir 'poolnext-secret'))) {
              throw "Service helper did not persist the SESSION_SECRET file."
            }

            $updatedBinary = Join-Path $env:RUNNER_TEMP 'poolnext-server-update.exe'
            Copy-Item -LiteralPath $binary -Destination $updatedBinary -Force
            & $helper update -InstallDir $installDir -ServiceName $serviceName -Port $port -NssmPath $nssm -BinaryPath $updatedBinary
            $service = Get-Service -Name $serviceName
            if ($service.Status -ne 'Running') {
              throw "Service state is '$($service.Status)' after update; expected Running."
            }
            Write-Host 'NSSM service helper end-to-end check passed.'
          } finally {
            try {
              if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
                & $helper uninstall -InstallDir $installDir -ServiceName $serviceName -RemoveData
              }
            } catch {
              Write-Host "service uninstall cleanup warning: $_"
            }
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              & $nssm remove $serviceName confirm 2>&1 | Write-Host
            }
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

  reproducible-build:
    name: Reproducible production build
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Build twice and compare
        run: |
          make verify-reproducible \
            VERSION="${{ needs.metadata.outputs.version }}" \
            COMMIT="${{ needs.metadata.outputs.commit }}"

  production-browser-smoke:
    name: Desktop and mobile production smoke
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download production binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-poolnext-server-linux-amd64
          path: dist

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: server/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml

      - name: Install browser test runtime
        working-directory: server/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run desktop and mobile smoke
        run: |
          chmod +x dist/poolnext-server
          node server/zashboard/scripts/production-smoke.mjs --binary dist/poolnext-server

  container-smoke:
    name: Hardened container and channel consistency
    needs: [metadata, production-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download production binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-poolnext-server-linux-amd64
          path: dist

      - name: Download WebUI build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-web-build
          path: server/web/build

      - name: Download Zashboard build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-zashboard-build
          path: server/zashboard/dist

      - name: Build image and compare production channels
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          BUILD_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          extractor="poolnext-extract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$extractor" >/dev/null 2>&1 || true' EXIT
          chmod +x dist/poolnext-server
          rm -rf /tmp/docker-assets
          docker build \
            --build-arg "VERSION=$BUILD_VERSION" \
            --build-arg "COMMIT=$BUILD_COMMIT" \
            --build-arg "WEB_BUILD_DIR=${{ github.workspace }}/server/web" \
            --target frontend-assets \
            --output type=local,dest=/tmp/docker-assets \
            server
          (cd server && find web/build zashboard/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) >/tmp/host-assets.sum
          (cd /tmp/docker-assets && find web/build zashboard/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) >/tmp/docker-assets.sum
          cmp /tmp/host-assets.sum /tmp/docker-assets.sum

          docker build \
            --build-arg "VERSION=$BUILD_VERSION" \
            --build-arg "COMMIT=$BUILD_COMMIT" \
            --build-arg "WEB_BUILD_DIR=${{ github.workspace }}/server/web" \
            --tag "poolnext-ci:$GITHUB_SHA" \
            server
          test "$(docker image inspect --format '{{.Config.User}}' "poolnext-ci:$GITHUB_SHA")" = "10001:10001"
          test "$(docker run --rm "poolnext-ci:$GITHUB_SHA" --version)" = "$BUILD_VERSION"
          docker create --name "$extractor" "poolnext-ci:$GITHUB_SHA" >/dev/null
          docker cp "$extractor:/usr/local/bin/poolnext-server" /tmp/docker-poolnext-server
          docker rm "$extractor" >/dev/null
          cmp dist/poolnext-server /tmp/docker-poolnext-server

      - name: Start least-privilege container and probe health
        shell: bash
        run: |
          set -euo pipefail
          container_name="poolnext-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_volume="${container_name}-data"
          session_secret="$(openssl rand -hex 32)"
          echo "CONTAINER_NAME=$container_name" >> "$GITHUB_ENV"
          echo "DATA_VOLUME=$data_volume" >> "$GITHUB_ENV"
          docker volume create "$data_volume" >/dev/null
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1::17778 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env GIN_MODE=release \
            --env LOG_LEVEL=warn \
            --env "SESSION_SECRET=$session_secret" \
            --env SQLITE_PATH=/data/poolnext.db \
            --env UPLOAD_PATH=/data/upload \
            --volume "$data_volume:/data" \
            "poolnext-ci:$GITHUB_SHA" >/dev/null

          address="$(docker port "$container_name" 17778/tcp | head -n1)"
          for attempt in {1..60}; do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_name")"
            if [[ "$health" == "healthy" ]] && curl --fail --silent "http://$address/api/status" >/tmp/poolnext-status.json; then
              cat /tmp/poolnext-status.json
              curl --fail --silent "http://$address/" | grep -qi '<!doctype html'
              test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_name")" = true
              test "$(docker inspect --format '{{.Config.User}}' "$container_name")" = "10001:10001"
              test "$(docker inspect --format '{{index .HostConfig.Tmpfs "/tmp"}}' "$container_name")" = "rw,nosuid,nodev,noexec,size=16m"
              test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_name")" = '["ALL"]'
              test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_name")" = '["no-new-privileges:true"]'
              test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Type}}:{{.Name}}{{end}}{{end}}' "$container_name")" = "volume:$data_volume"
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]]; then
              echo "PoolNeXt container exited before becoming ready" >&2
              exit 1
            fi
            sleep 2
          done
          echo "PoolNeXt container did not become healthy after ${attempt} attempts" >&2
          exit 1

      - name: Collect logs and clean up
        if: always()
        shell: bash
        run: |
          if [[ -n "${CONTAINER_NAME:-}" ]]; then
            docker logs "$CONTAINER_NAME" || true
            docker rm --force "$CONTAINER_NAME" || true
          fi
          if [[ -n "${DATA_VOLUME:-}" ]]; then
            docker volume rm "$DATA_VOLUME" || true
          fi
