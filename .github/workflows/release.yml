name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag to publish, for example v1.0.0-beta.
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      publish_latest: ${{ steps.version.outputs.publish_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version metadata
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pointed_tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          input_version="${INPUT_VERSION//[[:space:]]/}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ -n "$input_version" ]]; then
            version="$input_version"
          elif [[ -n "$pointed_tag" ]]; then
            version="$pointed_tag"
          else
            echo "workflow_dispatch requires a version when HEAD is not tagged" >&2
            exit 1
          fi

          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          stable_semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "version must be a SemVer tag such as v1.2.3 or v1.2.3-rc.1: $version" >&2
            exit 1
          fi

          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/$version^{commit}")"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "tag $version points to $tag_commit, not workflow commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          is_prerelease=true
          publish_latest=false
          if [[ "$version" =~ $stable_semver ]]; then
            is_prerelease=false
            latest_stable="$({ git tag --list 'v*'; printf '%s\n' "$version"; } | grep -E "$stable_semver" | sort -V | tail -n1)"
            if [[ "$version" == "$latest_stable" ]]; then publish_latest=true; fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

  quality:
    name: Required quality gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: poolnext-server-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: poolnext-server-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: poolnext-server-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: poolnext-server-darwin-arm64
          - goos: windows
            goarch: amd64
            asset_name: poolnext-server-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download verified WebUI build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-web-build
          path: server/web/build

      - name: Download verified Zashboard build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-zashboard-build
          path: server/zashboard/dist

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.24.13
          cache-dependency-path: server/go.sum

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_NAME: ${{ matrix.asset_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          make build-server-from-assets \
            GOOS="$GOOS" \
            GOARCH="$GOARCH" \
            VERSION="$VERSION" \
            COMMIT="$COMMIT" \
            SERVER_BINARY="$PWD/dist/$ASSET_NAME"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: [prepare, build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download server artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-server-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.publish_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
