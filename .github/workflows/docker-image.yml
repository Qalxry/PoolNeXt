name: Docker image builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version/tag to publish, for example v1.0.0-beta.
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve image metadata
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      publish_latest: ${{ steps.metadata.outputs.publish_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image metadata
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pointed_tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          version_input="${INPUT_VERSION//[[:space:]]/}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ -n "$version_input" ]]; then
            version="$version_input"
          elif [[ -n "$pointed_tag" ]]; then
            version="$pointed_tag"
          else
            echo "workflow_dispatch requires a version when HEAD is not tagged" >&2
            exit 1
          fi

          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          stable_semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "version must be a SemVer tag such as v1.2.3 or v1.2.3-rc.1: $version" >&2
            exit 1
          fi

          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/$version^{commit}")"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "tag $version points to $tag_commit, not workflow commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          publish_latest=false
          if [[ "$version" =~ $stable_semver ]]; then
            latest_stable="$({ git tag --list 'v*'; printf '%s\n' "$version"; } | grep -E "$stable_semver" | sort -V | tail -n1)"
            if [[ "$version" == "$latest_stable" ]]; then publish_latest=true; fi
          fi

          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=$version"
            echo "commit=${GITHUB_SHA::12}"
            echo "publish_latest=$publish_latest"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Required quality gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare, quality]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log into GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  merge:
    name: Publish multi-architecture manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: image-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log into GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          references=()
          tags=(-t "$IMAGE:$VERSION")
          for digest in *; do references+=("$IMAGE@sha256:$digest"); done
          if [[ ${#references[@]} -eq 0 ]]; then
            echo "no image digests were downloaded" >&2
            exit 1
          fi
          if [[ "$PUBLISH_LATEST" == "true" ]]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${references[@]}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}"
